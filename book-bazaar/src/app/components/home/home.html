<section class="text-book-gray">
  <section class="relative overflow-hidden bg-gradient-to-br from-indigo-50 via-white to-blue-50 py-16 lg:py-24"> <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-primary/5 blur-3xl"></div>
  <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 rounded-full bg-secondary/5 blur-3xl"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="flex flex-col lg:flex-row items-center gap-8 lg:gap-16"> <div class="w-full lg:w-1/2 text-center lg:text-left">
        <h1 class="text-4xl lg:text-6xl font-bold font-serif text-book-dark-gray mb-4 lg:mb-6 leading-tight">
          Discover Your <br class="hidden lg:block">
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-tertiary">Next Great Read</span>
        </h1>
        
        <p class="text-lg text-gray-600 mb-8 leading-relaxed max-w-xl mx-auto lg:mx-0">
          Explore thousands of books, read authentic reviews, and connect with fellow book lovers in our digital library.
        </p>

        <div class="max-w-lg mx-auto lg:mx-0 relative group z-20">
          <div class="absolute -inset-1 bg-gradient-to-r from-primary to-secondary rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
          <form [formGroup]="formGroup" (ngSubmit)="search()" class="relative bg-white rounded-full p-2 flex shadow-xl ring-1 ring-gray-900/5">
            <input 
              class="w-full rounded-full pl-6 pr-4 outline-none text-gray-700 placeholder-gray-400 bg-transparent text-lg" 
              placeholder="Title, author, or ISBN..." 
              formControlName="search"
            >
            <button 
              mat-flat-button 
              color="primary" 
              class="!rounded-full !h-12 !px-8 !text-lg !font-medium shadow-md transition-transform hover:scale-105 active:scale-95">
              Search
            </button>
          </form>
        </div>
      </div>

      <div class="w-full lg:w-1/2 flex justify-center lg:justify-end mt-12 lg:mt-0">
         <img src="hero-books-illustration.jpg" 
              alt="Books Illustration" 
              class="relative z-10 drop-shadow-2xl transform hover:-translate-y-2 transition duration-500 max-w-[80%] lg:max-w-full h-auto">
      </div>

    </div>
  </div>
</section>
  <section class="py-24 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <div class="text-center mb-16">
        <h2 class="text-4xl font-bold font-serif text-book-dark-gray mb-4">Browse by Genre</h2>
        <div class="h-1 w-24 bg-primary mx-auto rounded-full"></div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6">
        @for (genre of browsingGenres(); track $index) {
        <button matRipple
          class="group relative flex flex-col items-center justify-center p-6 h-40 bg-gray-50 rounded-2xl border border-gray-100 transition-all duration-300 hover:bg-white hover:shadow-xl hover:-translate-y-2 hover:border-primary/20"
          (click)="searchByGenre(genre)">

          <div
            class="w-14 h-14 rounded-full bg-white shadow-sm flex items-center justify-center mb-4 group-hover:bg-primary/10 transition-colors">
            <span class="text-2xl group-hover:scale-110 transition-transform">📚</span>
          </div>

          <p class="text-lg font-medium text-gray-700 group-hover:text-primary transition-colors">
            {{ genre.name }}
          </p>

          <div
            class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-1 bg-primary rounded-t-full transition-all duration-300 group-hover:w-12">
          </div>
        </button>
        }
      </div>

    </div>
  </section>
  <section class="p-20 bg-secondary-trans">
    <div class="flex justify-between items-center mb-12">
      <h2 class="text-3xl font-bold font-serif">Popular this week</h2>
      <button matButton="text" class="font-medium" (click)="this.router.navigate(['/search'])">View all</button>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
      @for (book of popularBooks(); track $index) {
      <app-book-card [book]="book"></app-book-card>
      }
    </div>
  </section>
  <div>
  </div>
</section>
