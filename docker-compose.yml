services:
  mysql:
    image: mysql:8.0  
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=070809az
    ports:
      - "3307:3306"
    volumes:
      - mysql-dev_data:/var/lib/mysql
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - e-library-network
  
  kc-mysql:
    image: mysql:8.0  
    container_name: kc-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=070809az
      - MYSQL_DATABASE=keycloak
      - MYSQL_USER=keycloak
      - MYSQL_PASSWORD=password
    ports:
      - "3308:3306"
    volumes:
      - kc-mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - e-library-network

  mongo:
    image: mongo:8.0
    container_name: mongo
    environment:
      MONGO_INITDB_DATABASE: review_db
    ports:
      - "27018:27017"
    volumes: 
      - ./docker/mongodb-dev/data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
    networks:
     - e-library-network

  keycloak:
    container_name: keycloak    
    image: quay.io/keycloak/keycloak:24.0.1
    command: [ "start-dev", "--import-realm" ]
    restart: always
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://kc-mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      JAVA_OPTS_APPEND: -Djboss.as.management.blocking.timeout=3600
    ports:
      - "8181:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import/
    depends_on:
      kc-mysql:
        condition: service_healthy
    networks:
      - e-library-network
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - e-library-network
  
  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - e-library-network
  
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - e-library-network
  
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8083:8080"
    depends_on:
      - broker
      - schema-registry
    environment:
      KAFKA_CLUSTERS_NAME: local
      KAFKA_CLUSTERS_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_SCHEMAREGISTRY: http://schema-registry:8085
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - e-library-network

  recommender-service:
    build:
      context: ./recommenderService
      dockerfile: Dockerfile
    container_name: recommender-service
    ports:
      - "8082:8082"
    environment:
      - ML_MODELS_DIR=/mnt/models
      - LOG_LEVEL=INFO
      - RECOMMENDER_SERVICE_PORT=8082
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8085
    volumes:
      - ./data/ml_models:/mnt/models
    networks:
      - e-library-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/v1/recommendations/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml
    networks:
      - e-library-network

  grafana:
    container_name: grafana
    image: grafana/grafana-enterprise
    ports:
      - '3000:3000'
    environment:
      - DS_PROMETHEUS=http://prometheus:9090
    volumes:
      - ./infrastructure/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infrastructure/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    networks:
      - e-library-network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - e-library-network
networks: 
  e-library-network:
volumes:
  mysql-dev_data:
  kc-mysql_data:
