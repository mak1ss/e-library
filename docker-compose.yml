services:
  mysql:
    image: mysql:8.0  
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=070809az
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - e-library-network

  book-service:
    build: /bookService
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    container_name: book-service
    ports: 
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - e-library-network

  mongo:
    image: mongo:8.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 070809az
      MONGO_INITDB_DATABASE: review_db
    ports:
      - "27018:27017"
    volumes: 
      - ./docker/mongodb/data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
    networks:
     - e-library-network
      
  review-service:
    container_name: review-service
    build: /reviewService
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8081:8081"
    depends_on:
      mongo: 
        condition: service_healthy
    networks:
      - e-library-network

  api-gateway:
    container_name: api-gateway
    build: /apiGateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "9000:9000"
    depends_on:
      book-service: 
        condition: service_started
      review-service: 
        condition: service_started
    networks:
      - e-library-network
  
  kc-mysql:
    image: mysql:8.0  
    container_name: kc-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=070809az
      - MYSQL_DATABASE=keycloak
      - MYSQL_USER=keycloak
      - MYSQL_PASSWORD=password
    ports:
      - "3308:3306"
    volumes:
      - ./docker/kc-mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - e-library-network
  
  keycloak:
    container_name: keycloak    
    image: quay.io/keycloak/keycloak:24.0.1
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://kc-mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8181:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      kc-mysql:
        condition: service_healthy
    networks:
      - e-library-network

networks: 
  e-library-network:
