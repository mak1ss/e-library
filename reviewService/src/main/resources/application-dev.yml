spring:
  data:
    mongodb:
      uri: mongodb://localhost:27018/
      database: review_db

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/e-library
          jwk-set-uri: http://localhost:8181/realms/e-library/protocol/openid-connect/certs
          token-uri: http://localhost:8181/realms/e-library/protocol/openid-connect/token

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      properties:
        schema:
          registry:
            url: http://localhost:8085
    producer:
      properties:
        schema:
          registry:
            url: http://localhost:8085

kafka:
  topics:
    book-deleted: book-deleted
    book-rating-updated: book-rating-updated
    review-scoring-request: review-scoring-requests
    review-scoring-result: review-scoring-results
    review-matrix-update: review-matrix-updates

book-service:
  url: http://localhost:8080
gateway:
  url: http://localhost:9000

data:
  seeding:
    folder: "../data/seeding/"