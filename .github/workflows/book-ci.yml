name: Book Service CI

on:
  push:
    paths: 
      - "bookService/**"
      - ".github/workflows/**"

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        
      - name: Compile of Book service
        run: |
          cd bookService
          mvn clean compile
          
  build: 
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        
      - name: Build of Book service
        run: |
          cd bookService
          mvn clean package -DskipTests

  test: 
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        
      - name: Tests execution of Book service
        run: |
          cd bookService
          mvn test 
        
      
      
  
