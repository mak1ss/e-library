spring:
  datasource:
    url: jdbc:mysql://localhost:3307/book_service
    username: root
    password: 070809az

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      properties:
        schema:
          registry:
            url: http://localhost:8085
    producer:
      properties:
        schema:
          registry:
            url: http://localhost:8085

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/e-library
          jwk-set-uri: http://localhost:8181/realms/e-library/protocol/openid-connect/certs
          token-uri: http://localhost:8181/realms/e-library/protocol/openid-connect/token

kafka:
  topics:
    book-deleted: book-deleted
    book-rating-updated: book-rating-updated
    book-metadata-changed: book-metadata-changes

gateway:
  url: http://localhost:9000

review-service:
  url: http://localhost:8081

recommender-service:
  url: http://localhost:8082

feign:
  client:
    config:
      recommender-service:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: FULL
      review-service:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: FULL

data:
  book:
    images:
      location: ../data/book_images/
      url-host: http://localhost:8080
  seeding:
    folder: ../data/seeding/
