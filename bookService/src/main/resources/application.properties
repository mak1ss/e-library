spring.application.name=bookService
spring.profiles.active=@spring.profiles.active@
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

springdoc.api-docs.path=/api-docs
openapi.api-docs.token-uri=http://localhost:8181/realms/e-library/protocol/openid-connect/token
openapi.api-docs.auth-uri=http://localhost:8181/realms/e-library/protocol/openid-connect/auth
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.group-id=book-service-group
spring.kafka.template.default-topic=book-deleted
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

management.endpoints.web.exposure.include=health, metrics, prometheus
management.endpoint.health.show-details=always

data.seeding.categories=categories.json
data.seeding.genres=genres.json
data.seeding.publishers=publishers.json
data.seeding.authors=authors.json
data.seeding.books=books.json

data.book.images.path=/api/book/images/

